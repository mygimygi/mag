<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f86ea">
<title>MAGNET POP : 전자석 대작전</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="frame">
  <div id="stage">
    <canvas id="cv" width="1280" height="720"></canvas>
    <div id="ui"></div>
    <button id="btnPause" class="hud-btn" aria-label="일시정지" hidden><i></i><i></i></button>
  </div>
  <div id="touch" hidden>
    <div class="movepad" data-pad aria-label="이동"><div class="mp-vis"><span class="hl"><i class="arrow l"></i></span><span class="hr"><i class="arrow r"></i></span></div><i class="mp-up"></i></div>
    <div class="pad right"><button data-act="jump" class="jump">JUMP</button><button data-act="magnet" class="mag"><span class="u"></span><b>전자석</b></button></div>
  </div>
</div>
<div id="turn" hidden><span class="phone"></span>휴대폰을 가로로 돌려서 플레이해요</div>
<div id="safe"></div>
<script src="js/sprites.js"></script>
<script src="js/heroart.js"></script>
<script src="js/config.js"></script>
<script src="js/save.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/bosses.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
