<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f86ea">
<title>MAGNET POP : 전자석 대작전</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon.png">
<link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
<div id="frame">
  <div id="stage">
    <canvas id="cv" width="1280" height="720"></canvas>
    <div id="ui"></div>
    <button id="btnPause" class="hud-btn" aria-label="일시정지" hidden><i></i><i></i></button>
    <button id="btnFs" class="hud-btn fs" aria-label="전체 화면" hidden><b></b></button>
  </div>
  <div id="touch" hidden>
    <div class="joy" data-pad aria-label="조이스틱"><div class="joy-base"><i class="ja u"></i><i class="ja d"></i><i class="ja l"></i><i class="ja r"></i><span class="joy-knob"></span></div></div>
    <div class="pad right"><button data-act="magnet" class="mag"><span class="u"></span><b>전자석</b></button></div>
  </div>
</div>
<div id="turn" hidden><span class="phone"></span>휴대폰을 가로로 돌려서 플레이해요</div>
<div id="safe"></div>
<script src="js/sprites.js?v=16"></script>
<script src="js/heroart.js?v=16"></script>
<script src="js/config.js?v=16"></script>
<script src="js/save.js?v=16"></script>
<script src="js/input.js?v=16"></script>
<script src="js/audio.js?v=16"></script>
<script src="js/game.js?v=16"></script>
<script src="js/bosses.js?v=16"></script>
<script src="js/render.js?v=16"></script>
<script src="js/ui.js?v=16"></script>
<script src="js/main.js?v=16"></script>
</body>
</html>
